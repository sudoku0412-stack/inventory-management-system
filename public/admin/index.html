<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Inventory Management System</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="bar">
    <h1>Admin console</h1>
    <p class="banner" id="banner" role="note">Read-only. Metadata only; medicine contents are never shown.</p>
    <p class="who" id="who"></p>
    <a class="signout" href="/cdn-cgi/access/logout">Sign out</a>
  </header>
  <nav aria-label="Admin sections" class="tabs" id="tabs">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#shops" data-tab="shops">Shops</a>
    <a href="#audit" data-tab="audit">Audit</a>
    <a href="#lists" data-tab="lists">Lists</a>
    <a href="#email" data-tab="email">Email</a>
    <a href="#activity" data-tab="activity">Admin log</a>
  </nav>
  <main id="main" tabindex="-1">
    <p id="status" role="status" aria-live="polite"></p>
    <section id="content"></section>
    <button type="button" id="more" hidden>Load more</button>
  </main>
  <dialog id="actionDialog" aria-labelledby="actionTitle" aria-describedby="actionEffect">
    <form id="actionForm" novalidate>
      <h2 id="actionTitle"></h2>
      <p id="actionEffect"></p>
      <label for="actionName" id="actionNameLabel" hidden></label>
      <input id="actionName" type="text" autocomplete="off" hidden>
      <label for="actionDays" id="actionDaysLabel" hidden>Keep for how many days from today? (7 to 30)</label>
      <input id="actionDays" type="number" min="7" max="30" step="1" value="14" hidden>
      <label for="actionReason">Reason (10 to 500 characters, recorded in the audit log)</label>
      <textarea id="actionReason" rows="3" maxlength="500" required></textarea>
      <p class="counter" id="actionCounter" aria-live="polite"></p>
      <p id="actionStatus" role="status" aria-live="polite"></p>
      <div class="actions"><button type="button" id="actionCancel">Cancel</button><button type="submit" id="actionSubmit" disabled></button></div>
    </form>
  </dialog>
  <script src="/admin/admin.js" type="module"></script>
</body>
</html>
