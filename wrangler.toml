name = "medicine-inventory"
main = "worker/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# The old hostname stays until Cloudflare Access also covers the new one and users have moved over.
routes = [
  { pattern = "medicineinventory.craftloop.ca", custom_domain = true },
  { pattern = "inventory-management.craftloop.ca", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "medicine-inventory"
database_id = "627ea233-74b9-4dd7-895c-7fecd4a2abbd"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "medicine-inventory-photos"

[[kv_namespaces]]
binding = "KV"
id = "153967330332430bbd75539c20258c61"

[triggers]
crons = ["*/15 * * * *"]

[vars]
PUSH_CONTACT = "mailto:household@craftloop.ca"
EMAIL_FROM = "Inventory Management System <notify@craftloop.ca>"
APP_URL = "https://medicineinventory.craftloop.ca"

# Required production secrets: ACCESS_TEAM_DOMAIN, ACCESS_AUD, INITIAL_OWNER_EMAILS.
# INITIAL_OWNER_EMAILS is a comma-separated, one-time bootstrap allowlist; never
# put personal addresses in this file or in source control.
